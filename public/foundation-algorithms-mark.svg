<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Foundation Algorithms</title>
  <desc id="desc">A circular algorithm atlas mark with intersecting orbits around a central foundation node.</desc>
  <style>
    .disc { fill: #17191e; }
    .orbit { fill: none; stroke: #f7f6f1; stroke-width: 1.7; opacity: .56; }
    .core { fill: #f7f6f1; }
    .node-foundation { fill: #6f89df; }
    .node-ai { fill: #9b7ae8; }
    .node-quantum { fill: #49b8a9; }
    .node-security { fill: #d98262; }
    .node-cross { fill: #c6a04d; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #efefea; }
      .orbit { stroke: #17191e; opacity: .5; }
      .core { fill: #17191e; }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="30"/>
  <ellipse class="orbit" cx="32" cy="32" rx="21" ry="8.5"/>
  <ellipse class="orbit" cx="32" cy="32" rx="21" ry="8.5" transform="rotate(60 32 32)"/>
  <ellipse class="orbit" cx="32" cy="32" rx="21" ry="8.5" transform="rotate(-60 32 32)"/>
  <circle class="core" cx="32" cy="32" r="4.2"/>
  <circle class="node-foundation" cx="11.2" cy="32" r="2.55"/>
  <circle class="node-ai" cx="42.4" cy="13.9" r="2.55"/>
  <circle class="node-quantum" cx="42.4" cy="50.1" r="2.55"/>
  <circle class="node-security" cx="21.6" cy="13.9" r="2.55"/>
  <circle class="node-cross" cx="52.8" cy="32" r="2.55"/>
</svg>
