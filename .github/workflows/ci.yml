name: Validate research hub

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for acceptance tests
        run: npx playwright install --with-deps chromium

      - name: Check Markdown links
        run: npm run check:links

      - name: Check source hygiene
        run: npm run check:source

      - name: Check UI consistency
        run: npm run check:ui

      - name: Verify experiment artifacts
        run: npm run check:experiments

      - name: Test research utilities
        run: npm run test:research

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Browser acceptance
        run: npm run test:acceptance

      - name: Report implementation freshness
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run report:freshness

      - name: Upload browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production route smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/foundation-algorithms-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Production server did not become ready."
            cat /tmp/foundation-algorithms-next.log
            exit 1
          fi

          routes=(
            "/"
            "/robots.txt"
            "/sitemap.xml"
            "/archive"
            "/archive?q=contextual%20bandit"
            "/algorithms"
            "/algorithms/linucb"
            "/atlas"
            "/lab"
            "/evidence"
            "/evidence/gaps"
            "/passages"
            "/claims"
            "/replications"
            "/replications/aumuller-2020-hnsw-evaluation"
            "/replications/chapelle-2011-thompson-evaluation"
            "/references"
            "/references/graph"
            "/references/li-2010-contextual-bandit-news"
            "/references/thompson-1933-probability-matching"
            "/implementations"
            "/implementations/faiss-hnsw"
            "/implementations/networkx-shortest-path-search"
            "/experiments"
            "/experiments/hnsw-linucb-reranking-drift-pilot"
            "/experiments/linucb-fuzzing-scheduler-drift-pilot"
          )

          for route in "${routes[@]}"; do
            echo "Checking $route"
            if ! curl --silent --fail --output /dev/null "http://127.0.0.1:3000${route}"; then
              echo "Route failed: $route"
              cat /tmp/foundation-algorithms-next.log
              exit 1
            fi
          done
