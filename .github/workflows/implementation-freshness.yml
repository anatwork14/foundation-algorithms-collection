name: Implementation freshness report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compare verified refs with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run report:freshness

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        with:
          name: implementation-freshness
          path: test-results/implementation-freshness.json
          if-no-files-found: error
          retention-days: 30
